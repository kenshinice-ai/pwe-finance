<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found | PWE Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://kenshinice-ai.github.io/pwe-finance/css/style.css">
  <link rel="icon" type="image/svg+xml" href="https://kenshinice-ai.github.io/pwe-finance/icons/favicon.svg">
  <meta name="theme-color" content="#222159">
  <style>
    /* 404 is served for any missing path (including /zh/…), so all links below
       are absolute to the canonical base. Update them if the domain changes. */
    .nf-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #151545 0%, #222159 48%, #083f58 100%); padding: 24px; }
    .nf-card { max-width: 560px; text-align: center; color: #fff; }
    .nf-code { font-size: clamp(4rem, 12vw, 6.5rem); font-weight: 700; line-height: 1; color: var(--brand-cyan, #00AAE5); }
    .nf-card h1 { font-size: clamp(1.3rem, 4vw, 1.8rem); margin: 16px 0 8px; }
    .nf-card p { color: rgba(255,255,255,0.75); line-height: 1.8; margin-bottom: 8px; }
    .nf-card .zh { font-family: 'Poppins', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .nf-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
  </style>
</head>
<body>
<div class="nf-wrap">
  <div class="nf-card">
    <div class="nf-code">404</div>
    <h1>Page not found · 页面未找到</h1>
    <p>The page you are looking for may have been moved or no longer exists.</p>
    <p class="zh" lang="zh-CN">您访问的页面可能已被移动或不存在。</p>
    <div class="nf-actions">
      <a class="btn btn-primary" href="https://kenshinice-ai.github.io/pwe-finance/">Home · 英文首页</a>
      <a class="btn btn-outline" href="https://kenshinice-ai.github.io/pwe-finance/zh/index.html" lang="zh-CN">中文首页</a>
    </div>
  </div>
</div>
</body>
</html>
